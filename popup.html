<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinokino</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="card">
      <header class="hero">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 4.5h14A2.5 2.5 0 0 1 21.5 7v10A2.5 2.5 0 0 1 19 19.5H5A2.5 2.5 0 0 1 2.5 17V7A2.5 2.5 0 0 1 5 4.5Z" stroke="currentColor" stroke-width="1.8"/><path d="m10 9 5 3-5 3V9Z" fill="currentColor"/></svg>
        </div>
        <div>
          <p class="eyebrow">РАСШИРЕНИЕ ДЛЯ KINOPOISK</p>
          <h1>Kinokino</h1>
        </div>
        <span class="online"><i></i> Активно</span>
      </header>

      <p class="intro">Укажите сайт, который будет открываться по кнопке «Смотреть» на странице фильма.</p>

      <form id="settings-form" novalidate>
        <label for="domain">Адрес сайта</label>
        <div class="input-wrap">
          <svg class="globe" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.7"/><path d="M3.75 12h16.5M12 3.75c2.15 2.27 3.23 5.02 3.23 8.25S14.15 18 12 20.25C9.85 18 8.77 15.25 8.77 12S9.85 6.02 12 3.75Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="domain" type="text" inputmode="url" placeholder="www.kinokino.vip" autocomplete="off" spellcheck="false">
        </div>
        <p class="hint">Можно указать домен или полный URL.</p>

        <div class="actions">
          <button id="save" class="save" type="submit"><span class="button-text">Сохранить</span><svg class="check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.2 4L19 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="reset" class="reset" type="button" title="Вернуть исходный домен">Сбросить</button>
        </div>
      </form>
      <output id="status" aria-live="polite"></output>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
